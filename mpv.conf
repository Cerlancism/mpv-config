title=mpv ${filename} ${width}x${height} ${mpv-version}

no-osd-bar
no-keepaspect-window

osd-font-size=10
#screen=0
#geometry=1920x1130++250-+0
geometry=2560x1500
keep-open=always
volume=100
volume-max=300
sub-font-size=32
sub-margin-y=30
sub-bold=no
sub-font="Microsoft YaHei"

vo=gpu-next
gpu-api=auto
hwdec=d3d11va

screenshot-directory = '~~desktop/'

scale=ewa_lanczos
#glsl-shaders-clr
glsl-shaders="~~/shaders/FSR.glsl"
#dscale=mitchell
dscale=spline64
#cscale=mitchell
cscale=spline64
sigmoid-upscaling=yes
correct-downscaling

cache=yes
demuxer-seekable-cache=yes 
demuxer-max-bytes=256MiB 
demuxer-max-back-bytes=256MiB 
demuxer-readahead-secs=10 
stream-buffer-size=1MiB

demuxer-lavf-o=allowed_extensions=ALL

audio-channels=stereo

# Pre-load scaletempo2 so it's ALWAYS in the audio chain. Otherwise mpv
# inserts/removes it on every speed change, and that audio-filter graph reinit
# stalls playback ("stuck for a moment") on speed-up/restore -- the real culprit
# behind playspeed framedrops. Pre-loaded, a speed change is just a ratio param
# update (seamless), not a graph rebuild.
# Safe at 1x: confirmed bit-exact passthrough in the source -- at rate ~= 1,
# mp_scaletempo2_fill_buffer takes a fast path that plain-copies input to output
# (no WSOLA/overlap-add). See af_scaletempo2_internals.c, the |rate|~=1 branch.
af=scaletempo2
